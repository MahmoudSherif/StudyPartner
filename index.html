<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MotivaMate - Your Mobile Study Companion</title>
    
    <!--
      Content Security Policy (v6).

      Backstop only, for contexts that serve index.html without edge headers
      (local `vite preview`, plain static servers). public/_headers carries the
      authoritative policy for Cloudflare Pages and the two MUST stay in sync:
      browsers enforce the INTERSECTION of every policy that applies, so
      anything omitted here is blocked even if _headers allows it.

      Notes:
        - connect-src must include https://*.supabase.co AND wss://*.supabase.co.
          Supabase Realtime uses websockets; without the wss entry, live
          challenge updates fail while ordinary requests appear to work.
        - The Firebase and Google origins that used to be listed here were
          removed with the Firebase backend.
        - frame-ancestors and Strict-Transport-Security are IGNORED in a meta
          CSP; clickjacking protection comes solely from the _headers rule
          (frame-ancestors 'none' + X-Frame-Options: DENY).
        - 'unsafe-eval' and data: are deliberately absent from script-src.
        - 'unsafe-inline' is still required by the two small inline <script>
          blocks below. A meta CSP cannot use nonces reliably.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
    <meta name="csp-version" content="v6-supabase">
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Your mobile study companion with timer, tasks, and progress tracking">
    <meta name="theme-color" content="#4c1d95">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MotivaMate">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon.svg">
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Splash Screen Images for iOS -->
    <!-- Splash Screen Images for iOS (can be generated for device sizes later) -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512.png">
    
    <!--
      Service Worker.

      Registered at its plain path: the previous `?v=3-csp-fix` query string
      made the browser treat it as a distinct script URL, so the cache-busting
      it was meant to provide only ever happened when someone remembered to
      edit that string by hand. Browsers already byte-compare /sw.js on every
      navigation and install a changed one automatically.
    -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        // A waiting worker means a new build is ready; take it
                        // over on the next navigation rather than stranding the
                        // user on the old bundle indefinitely.
                        registration.addEventListener('updatefound', () => {
                            const installing = registration.installing;
                            if (!installing) return;
                            installing.addEventListener('statechange', () => {
                                if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('New version available; it will apply on next load.');
                                }
                            });
                        });
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
    
    <!-- Styles -->
    <link href="/src/main.css" rel="stylesheet" />
    
    <!-- Prevent zoom on input focus (iOS Safari) -->
    <style>
        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            font-size: 16px !important;
        }
        
        /* Fix for iOS safe areas */
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        
        /* Prevent text selection on buttons and interactive elements */
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Improve touch targets */
        button, [role="button"] {
            min-height: 44px;
            min-width: 44px;
        }
    </style>
</head>

<body>
        <div id="offline-fallback" style="display:none;padding:2rem;text-align:center;color:#fff;font-family:system-ui;background:#121212;min-height:100vh;">
            <h1>Offline</h1>
            <p>The app shell is cached. Reconnecting...</p>
        </div>
        <div id="root"></div>
        <script>
            window.addEventListener('offline',()=>{
                const o=document.getElementById('offline-fallback');if(o) o.style.display='block';
            });
            window.addEventListener('online',()=>{
                const o=document.getElementById('offline-fallback');if(o) o.style.display='none';
            });
        </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
