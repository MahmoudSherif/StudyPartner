name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cloudflare is authenticated with an API token from secrets, not with the
# GitHub OIDC/Pages grants this workflow used to need. `contents: read` is
# enough to check the repository out.
permissions:
  contents: read

# Serialise deploys so a slower run cannot overwrite a newer one. Not cancelling
# in-progress runs: a half-uploaded Pages deployment is worse than a slow queue.
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vite silently inlines an empty string for a missing VITE_ variable, so a
      # missing secret ships a build that looks fine and fails at runtime with an
      # opaque Supabase error. Fail here instead, where the cause is obvious.
      - name: Verify required secrets are present
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          : "${VITE_SUPABASE_URL:?missing repository secret VITE_SUPABASE_URL}"
          : "${VITE_SUPABASE_ANON_KEY:?missing repository secret VITE_SUPABASE_ANON_KEY}"

      - name: Build
        run: npm run build
        env:
          # The Supabase URL and anon key are public by design — they are baked
          # into the client bundle and Row Level Security is what enforces
          # access. They live in secrets so the deployed app targets the
          # intended project rather than whatever fallback is committed in
          # source, not because the values are confidential. See .env.example.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENVIRONMENT: production

      # TEMPORARY GUARD — delete this step once Firebase is fully retired.
      # `functions/` at the repository root contains Firebase Cloud Functions
      # (firebase-admin / firebase-functions), but Cloudflare Pages treats a
      # root-level `functions/` directory as Pages Functions source and will try
      # to bundle it into the deployment. `wrangler pages deploy` offers no flag
      # to opt out, and a bundled Pages Function would additionally bypass the
      # `_headers` rules for any route it claimed.
      # This only renames the directory inside the ephemeral runner checkout —
      # nothing is committed or pushed.
      - name: Hide Firebase functions/ from Pages Functions detection
        run: |
          if [ -d functions ]; then
            mv functions .firebase-functions-not-for-pages
            echo "Moved Firebase functions/ aside for this deploy."
          fi

      # Project name and upload directory both come from wrangler.toml
      # (`name` and `pages_build_output_dir`), so there is exactly one place to
      # change them and CI cannot drift from a local `wrangler pages deploy`.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy
