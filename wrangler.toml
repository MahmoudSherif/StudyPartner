# Cloudflare Pages project configuration.
#
# The presence of `pages_build_output_dir` is what marks this as a Pages project
# rather than a Worker. Cloudflare reads this file on its own build runners
# after cloning the repo, so the output directory travels with the source
# instead of living only in a dashboard field someone can edit out of step.

# Must match the Cloudflare Pages project name exactly, or the deploy step
# fails. The project is created once through the dashboard — Workers & Pages >
# Create > Pages > Connect to Git — not from the CLI; see CLOUDFLARE_DEPLOY.md.
# Cloudflare pre-fills the *repository* name (`studypartner`), which does not
# match and must be changed at creation time.
name = "motivamate"

# `npm run build` output directory. public/_headers and public/_redirects are
# copied into it verbatim by Vite and are read by Pages from the upload root.
pages_build_output_dir = "dist"

# Inert for a purely static SPA — it only selects the Workers runtime semantics
# used by Pages Functions, and this project intentionally has none.
compatibility_date = "2026-08-07"
